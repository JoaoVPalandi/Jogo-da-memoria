<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="login.css">

    <style>
        /* ---------------------------------------------
           Botão para alternar o modo alto contraste
           Fica fixo no canto superior direito da tela
        --------------------------------------------- */
        .contrast-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 200; /* garante que fique acima de outros elementos */
            font-size: 1.8em;
            background: transparent;
            border: none;
            cursor: pointer; /* muda o cursor para indicar que é clicável */
        }

        /* ---------------------------------------------
           Tema de Alto Contraste
           Quando o usuário ativa o contraste, a classe
           'high-contrast' é adicionada ao <body>
        --------------------------------------------- */
        body.high-contrast {
            background-color: #000 !important; /* fundo preto */
            color: #fff !important; /* texto branco para máxima legibilidade */
        }

        /* Aplica alto contraste a elementos específicos */
        body.high-contrast h1,
        body.high-contrast p,
        body.high-contrast input,
        body.high-contrast button {
            color: #fff !important;
            background-color: #222 !important; /* fundo escuro nos inputs e botões */
            border-color: #fff !important; /* bordas claras para destacar os elementos */
        }

        /* Placeholder dos campos de input no modo alto contraste */
        body.high-contrast .login_input::placeholder {
            color: #ccc !important; /* cinza claro para contraste com fundo escuro */
        }

        /* Efeito de hover nos campos de input e botão no modo alto contraste */
        body.high-contrast .login_input:hover,
        body.high-contrast .login_button:hover {
            background-color: #555 !important; /* leve clareamento para indicar interação */
            color: #fff !important;
        }

        /* Ajuste específico do botão Play */
        body.high-contrast .login_button {
            border: 2px solid #fff !important; /* borda clara para visibilidade */
        }

        /* Mantém a logo visível mesmo no modo alto contraste */
        body.high-contrast img {
            filter: none;
        }
    </style>
</head>

<body>
    <!-- ---------------------------------------------
         Botão de alto contraste
         O emoji 👁️ indica a função de “visualização melhorada”
    --------------------------------------------- -->
    <button id="contrastToggle" class="contrast-btn">👁️</button>

    <!-- ---------------------------------------------
         Formulário de login para nome dos jogadores
         Antes de iniciar o jogo, o usuário preenche os nomes
    --------------------------------------------- -->
    <form class="login-form">
        <h1>JOGO DA MEMÓRIA</h1>

        <div class="login">
            <img src="logo.png" alt="logo do jogo">
        </div>

        <!-- Inputs para nomes dos jogadores -->
        <input type="text" id="player1" placeholder="Player1" class="login_input">
        <input type="text" id="player2" placeholder="Player2" class="login_input">

        <!-- Botão de início do jogo -->
        <button type="button" class="login_button" onclick="startGame()">Play</button>
    </form>

    <script>
        /* ---------------------------------------------
           Função para iniciar o jogo
           Salva os nomes dos jogadores no localStorage
           e redireciona para a tela do jogo
        --------------------------------------------- */
        function startGame() {
            const p1 = document.getElementById("player1").value || "Player 1";
            const p2 = document.getElementById("player2").value || "Player 2";

            localStorage.setItem("player1", p1);
            localStorage.setItem("player2", p2);

            window.location.href = "jogo.html"; // redireciona para a tela do jogo
        }

        /* ---------------------------------------------
           Script para controlar o modo de alto contraste
           - Aplica a preferência salva no localStorage
           - Permite alternar o contraste clicando no botão 👁️
        --------------------------------------------- */
        document.addEventListener('DOMContentLoaded', () => {
            const contrastBtn = document.getElementById('contrastToggle');

            // Verifica se o usuário já ativou o alto contraste anteriormente
            if (localStorage.getItem('highContrast') === 'true') {
                document.body.classList.add('high-contrast');
            }

            // Alterna o modo alto contraste ao clicar no botão
            contrastBtn.addEventListener('click', () => {
                document.body.classList.toggle('high-contrast');
                localStorage.setItem('highContrast', document.body.classList.contains('high-contrast'));
            });
        });
    </script>
</body>

</html>
